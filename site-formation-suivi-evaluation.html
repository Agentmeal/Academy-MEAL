<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Académie Suivi-Évaluation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Mise en page : en-tête fin, hero en deux colonnes (texte + cadre logique d'exemple), cartes de modules, pages de cours en colonne unique de 68 caractères. */
:root{
  --bg:#EDF2F1;
  --grid:rgba(15,46,51,.055);
  --surface:#FFFFFF;
  --ink:#0F2E33;
  --muted:#506669;
  --line:#C9D7D6;
  --accent:#1C4FD1;
  --accent-ink:#FFFFFF;
  --accent-soft:#E2E9FB;
  --ok:#17734A;
  --ok-soft:#DDF0E5;
  --bad:#B3261E;
  --bad-soft:#FBE3E0;
  --paper:#FBFCFA;
  --paper-ink:#0F2E33;
  --paper-accent:#1C4FD1;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1A1D;--grid:rgba(228,239,238,.045);--surface:#12262A;--ink:#E3EEED;--muted:#97AEB0;
    --line:#274248;--accent:#86A9FF;--accent-ink:#0A1330;--accent-soft:#1B2C58;--ok:#5FD39A;--ok-soft:#13362A;--bad:#FF8F85;--bad-soft:#40201D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1A1D;--grid:rgba(228,239,238,.045);--surface:#12262A;--ink:#E3EEED;--muted:#97AEB0;
  --line:#274248;--accent:#86A9FF;--accent-ink:#0A1330;--accent-soft:#1B2C58;--ok:#5FD39A;--ok-soft:#13362A;--bad:#FF8F85;--bad-soft:#40201D;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  font-family:var(--f-body);font-size:17px;line-height:1.6;color:var(--ink);
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:0;padding-bottom:0;
}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;letter-spacing:-.015em;text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin-inline:auto}

/* En-tête */
.top{border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.1rem;color:var(--ink);text-decoration:none}
.brand svg{flex:none}
.nav{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center}
.nav a{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 0;border-bottom:2px solid transparent}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.nav .count{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);border:1px solid var(--line);padding:3px 8px;border-radius:4px;background:var(--surface)}

main{padding-block:36px 64px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 1rem/1 var(--f-body);padding:13px 20px;border-radius:5px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);text-decoration:none;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft);filter:none}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:8px 44px}
.hero h1{font-size:clamp(2.1rem,5.4vw,3.5rem);font-weight:700;margin-block:14px 16px}
.ticks{height:10px;width:min(320px,100%);margin-block:0 18px;background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 16px);opacity:.55;border-bottom:1px solid var(--ink)}
.lede{font-size:1.15rem;max-width:34em;color:var(--muted)}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin-top:26px}
.meta{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.logframe{background:var(--surface);border:1px solid var(--ink);border-radius:6px;min-width:0;overflow:hidden}
.logframe .cap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:.74rem;letter-spacing:.05em;text-transform:uppercase}
.tablewrap{overflow-x:auto}
.logframe table{width:100%;border-collapse:collapse;min-width:430px;font-size:.93rem}
.logframe th{font-family:var(--f-mono);font-weight:500;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
.logframe td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.logframe tr:last-child td{border-bottom:0}
.logframe td:first-child{font-family:var(--f-mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);white-space:nowrap}
.logframe td:last-child{font-family:var(--f-mono);font-size:.85rem;white-space:nowrap;font-variant-numeric:tabular-nums}

/* Sections */
.sec{margin-top:20px}
.sec>h2{font-size:1.7rem;margin-bottom:6px}
.sec>.sub{color:var(--muted);margin-bottom:22px;max-width:46em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;color:var(--ink);text-decoration:none}
.card:hover{border-color:var(--accent)}
.card h3{font-size:1.25rem}
.card p{color:var(--muted);font-size:.97rem}
.card .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:6px}
.cardtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.chip.lock{color:var(--muted)}
.bar6{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar6>span{display:block;height:100%;background:var(--accent)}
.bar6.ok>span{background:var(--ok)}
.small{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.band{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;margin-top:16px}
.band .card{background:var(--accent-soft);border-color:transparent}
.band .card.is-ok{background:var(--ok-soft)}

/* Cours */
.back{display:inline-block;font-family:var(--f-mono);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;text-decoration:none;margin-bottom:22px}
.mhead{max-width:44em;margin-bottom:30px}
.mhead h1{font-size:clamp(1.9rem,4.6vw,2.8rem);margin-block:10px 12px}
.mhead p.r{color:var(--muted);font-size:1.1rem}
.lesson{max-width:68ch;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px 26px;margin-bottom:16px}
.lesson h2{font-size:1.4rem;margin-bottom:12px}
.lesson p+p{margin-top:12px}
.key{margin-top:16px;padding:12px 14px;background:var(--accent-soft);border-radius:4px;font-size:.98rem}
.key b{display:block;font-family:var(--f-mono);font-weight:500;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.readbtn{margin-top:18px;display:inline-flex;align-items:center;gap:10px;font:600 .95rem/1 var(--f-body);padding:10px 14px;border-radius:5px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.readbtn:hover{border-color:var(--accent)}
.readbtn .box{width:18px;height:18px;border:2px solid var(--muted);border-radius:4px;display:grid;place-items:center;font-size:.8rem;line-height:1}
.readbtn[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.readbtn[aria-pressed="true"]{border-color:var(--ok)}

/* Quiz */
.qbox{max-width:68ch;background:var(--surface);border:1px solid var(--ink);border-radius:6px;padding:24px 26px;margin-top:28px;scroll-margin-top:16px}
.qbox h2{font-size:1.4rem;margin-bottom:8px}
.qbox .lead{color:var(--muted);margin-bottom:16px}
.qtop{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.qtop .bar6{flex:1}
.qtitle{font-size:1.3rem;margin-bottom:16px;outline:none}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:5px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .lt{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .lt{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .lt{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .lt{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opts.done .opt{cursor:default}
.fb{margin-top:16px;padding:12px 14px;border-radius:4px;font-size:.98rem}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.qactions{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px}
.score{font-family:var(--f-display);font-weight:700;font-size:3.2rem;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.review{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.review div{padding:12px 14px;border:1px solid var(--line);border-radius:5px;font-size:.96rem}
.review b{display:block;margin-bottom:4px}
.gate{max-width:60ch;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px 26px}
.gate ul{margin:12px 0 0;padding-left:1.2em}

/* Certificat */
.certwrap{overflow-x:auto;margin-block:20px}
.cert{min-width:560px;max-width:820px;margin-inline:auto;background:var(--paper);color:var(--paper-ink);border:2px solid var(--paper-ink);outline:1px solid var(--paper-ink);outline-offset:-10px;padding:48px 52px;text-align:center}
.cert .e{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-accent)}
.cert h2{font-size:2rem;margin-block:14px 18px}
.cert .s{font-size:.95rem;opacity:.75}
.cert .n{font-family:var(--f-display);font-size:2.4rem;font-weight:700;margin-block:6px 14px;border-bottom:1px solid var(--paper-ink);display:inline-block;padding-inline:20px;max-width:100%;overflow-wrap:anywhere}
.cert .t{max-width:44ch;margin-inline:auto}
.cert .f{display:flex;justify-content:space-between;gap:20px;margin-top:34px;text-align:left;font-size:.9rem}
.cert .f span{display:block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.cert .f code{font-family:var(--f-mono);font-size:.95rem}
.formrow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:16px}
.field{display:flex;flex-direction:column;gap:6px;flex:1 1 260px;min-width:0}
.field label{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field input{font:inherit;padding:11px 12px;border:1px solid var(--ink);border-radius:5px;background:var(--surface);color:var(--ink);min-width:0}
.toast{margin-top:12px;font-family:var(--f-mono);font-size:.82rem;color:var(--muted);min-height:1.2em}
.note{max-width:68ch;color:var(--muted);font-size:.92rem;margin-top:14px}
.foot{border-top:1px solid var(--line);padding-block:20px 36px;color:var(--muted);font-size:.9rem}

@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr);gap:28px}}
@media (max-width:520px){.lesson,.qbox,.gate{padding:20px 18px}.cert{padding:36px 26px}}
@media (prefers-reduced-motion:no-preference){.bar6>span{transition:width .35s ease}.opt,.card,.btn{transition:border-color .15s,background .15s,filter .15s}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#accueil" aria-label="Académie Suivi-Évaluation, accueil">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M4 3v23h23" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M8 20l6-6 4 3 8-9" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/><circle cx="14" cy="14" r="2.2" fill="var(--accent)"/><circle cx="26" cy="8" r="2.2" fill="var(--accent)"/></svg>
      Académie Suivi-Évaluation
    </a>
    <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
  </div>
</header>
<main id="app" class="wrap" tabindex="-1"></main>
<footer class="foot wrap">Votre progression est enregistrée dans ce navigateur uniquement. Les exemples chiffrés sont fictifs et servent à illustrer les notions.</footer>

<script>
(function(){
"use strict";
var PASS=75, PASS_FINAL=80;

var MODULES=[
{id:1,titre:"Fondamentaux du suivi-évaluation",duree:"40 min",
 resume:"Distinguer le suivi de l'évaluation, lire une chaîne de résultats et savoir pourquoi on mesure.",
 lecons:[
 {t:"Suivi et évaluation : deux fonctions complémentaires",
  p:["Le suivi est une collecte régulière d'informations pendant la mise en œuvre. Il vérifie que les activités avancent comme prévu, que les budgets sont consommés au bon rythme et que les produits sont livrés. Il répond à la question « où en sommes-nous ? ».","L'évaluation est un jugement plus approfondi, réalisé à des moments précis (à mi-parcours, en fin de projet, parfois plusieurs années après). Elle répond à « pourquoi observe-t-on ces résultats, et le programme a-t-il vraiment changé quelque chose ? »."],
  cle:"Le suivi fournit les données de base dont l'évaluation a besoin. Sans suivi rigoureux, une évaluation manque de matière."},
 {t:"La chaîne des résultats",
  p:["Un programme se décrit par une suite d'étapes liées par la causalité : les intrants (budget, personnel, matériel), les activités, les produits (ce que le projet livre directement), les effets (ce que les bénéficiaires changent grâce aux produits) et l'impact (le changement durable à long terme).","Exemple pour un programme d'eau potable : forer 25 puits est une activité, disposer de 40 points d'eau protégés fonctionnels est un produit, la hausse de la part des ménages qui boivent une eau sûre est un effet, et la baisse de la mortalité infantile liée aux diarrhées est un impact."],
  cle:"Le projet contrôle ses activités et ses produits. Il ne contrôle qu'en partie les effets, et encore moins l'impact."},
 {t:"Mesurer pour quoi faire ?",
  p:["Le système de suivi-évaluation sert trois usages : rendre des comptes aux bailleurs et aux communautés (redevabilité), apprendre de ce qui marche ou non, et décider (réorienter une activité, changer de zone, arrêter une approche).","La règle pratique : on ne collecte une donnée que si l'on sait qui l'utilisera et pour quelle décision. Chaque question de plus dans un questionnaire coûte du temps aux enquêteurs et aux enquêtés."],
  cle:"Une donnée que personne n'utilise est un coût, pas un atout."}
 ],
 quiz:[
 {q:"Laquelle de ces questions relève typiquement du suivi ?",o:["Le programme a-t-il changé durablement la vie des ménages dix ans plus tard ?","Combien de formations ont été réalisées ce trimestre par rapport au plan ?","Le programme était-il le meilleur choix stratégique pour la région ?","Quelle part de l'économie nationale le programme a-t-il influencée ?"],a:1,e:"Le suivi compare en continu ce qui est réalisé à ce qui était prévu. Les trois autres questions portent sur l'effet, la pertinence ou l'impact et relèvent de l'évaluation."},
 {q:"Dans la chaîne des résultats, « 40 points d'eau protégés fonctionnels » est :",o:["Une activité","Un intrant","Un produit","Un impact"],a:2,e:"Un produit est ce que le projet livre directement à l'issue de ses activités."},
 {q:"Quel est l'ordre correct de la chaîne des résultats ?",o:["Activités, intrants, effets, produits, impact","Intrants, activités, produits, effets, impact","Intrants, produits, activités, impact, effets","Activités, produits, intrants, effets, impact"],a:1,e:"On part des ressources (intrants), on mène des activités, qui donnent des produits, puis des effets et enfin un impact."},
 {q:"Pourquoi limiter la collecte aux données qui serviront à une décision ?",o:["Pour éviter de surcharger enquêteurs et enquêtés avec des données jamais exploitées","Parce que les bailleurs interdisent les questionnaires longs","Parce que les données qualitatives sont inutiles","Pour ne pas avoir à analyser les résultats"],a:0,e:"Chaque donnée a un coût de collecte, de saisie et de contrôle qualité. Il faut la justifier par un usage précis."}
 ]},
{id:2,titre:"Théorie du changement et cadre logique",duree:"50 min",
 resume:"Expliciter pourquoi le projet devrait fonctionner, puis le traduire en matrice de planification.",
 lecons:[
 {t:"La théorie du changement",
  p:["Une théorie du changement raconte comment et pourquoi on pense que les activités mèneront aux résultats souhaités. Elle prend la forme de relations « si… alors… » et rend visibles les hypothèses sur lesquelles repose le projet.","Exemple : si des agriculteurs reçoivent des semences améliorées et une formation aux techniques culturales, alors leurs rendements augmentent, à condition que la pluviométrie reste proche de la normale. La dernière partie est une hypothèse, pas une certitude."],
  cle:"Une bonne théorie du changement explique le « pourquoi », pas seulement le « quoi »."},
 {t:"Le cadre logique",
  p:["Le cadre logique (ou logframe) est une matrice qui résume le projet. Ses lignes correspondent aux niveaux de résultats : objectif global, objectif spécifique, résultats attendus, activités. Ses colonnes sont la logique d'intervention, les indicateurs, les sources de vérification et les hypothèses.","La colonne « sources de vérification » précise où l'on trouvera la donnée de chaque indicateur : registre du centre de santé, enquête auprès des ménages, rapport de formation. Un indicateur sans source identifiée ne pourra pas être suivi."],
  cle:"On lit le cadre logique de bas en haut : si les activités sont menées, alors les résultats sont atteints, et ainsi de suite."},
 {t:"Hypothèses et risques",
  p:["Une hypothèse est une condition externe nécessaire à la réussite : une stabilité sécuritaire suffisante, une saison des pluies normale, l'engagement des autorités locales. Le projet ne la contrôle pas.","Les hypothèses clés se suivent comme les indicateurs. Si l'une d'elles cesse d'être vraie, le projet peut échouer alors que ses activités sont parfaitement exécutées. Il faut alors ajuster le plan."],
  cle:"Une hypothèse que l'on ne suit pas devient un angle mort."}
 ],
 quiz:[
 {q:"Une théorie du changement décrit surtout :",o:["La liste des dépenses autorisées","Le calendrier des missions de terrain","Le chemin causal supposé entre activités et changement, avec ses hypothèses","Les noms des partenaires de mise en œuvre"],a:2,e:"Elle explicite la logique « si… alors… » et les conditions qui doivent être réunies pour que le changement se produise."},
 {q:"Quelle colonne du cadre logique indique où trouver la donnée d'un indicateur ?",o:["Les hypothèses","Les sources de vérification","La logique d'intervention","Le budget"],a:1,e:"Les sources (ou moyens) de vérification précisent d'où provient la donnée : registres, enquêtes, rapports."},
 {q:"« La saison des pluies sera normale » est un exemple de :",o:["Activité","Produit","Hypothèse sur une condition externe","Indicateur"],a:2,e:"Le projet ne contrôle pas la pluviométrie, mais ses résultats en dépendent. C'est typiquement une hypothèse."},
 {q:"Quelle formulation est une relation « si… alors… » correcte ?",o:["Si les agents de santé sont formés et équipés, alors les consultations prénatales augmentent.","Nous allons former 200 agents de santé.","Le projet coûtera 300 000 euros.","Les agents de santé sont importants."],a:0,e:"Seule la première relie une cause (formation, équipement) à un changement attendu (plus de consultations)."}
 ]},
{id:3,titre:"Indicateurs et collecte de données",duree:"55 min",
 resume:"Formuler des indicateurs solides, fixer une situation de référence et choisir les bonnes méthodes de collecte.",
 lecons:[
 {t:"Un bon indicateur",

var KEY="ase-v1";

var S=load()||{};
S.lu=S.lu||{};S.scores=S.scores||{};S.final=S.final||null;S.cert=S.cert||null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

var dl=null;
try{
  if(window.claude&&window.claude.use){

/* ---------- Utilitaires ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function pc(n){return n+" %"}
function mod(id){for(var i=0;i<MODULES.length;i++)if(MODULES[i].id===id)return MODULES[i];return null}
function best(id){var s=S.scores[id];return s?s.best:null}
function passed(m){var b=best(m.id);return b!==null&&b>=PASS}
function allPassed(){return MODULES.every(passed)}
function readCount(m){var n=0;for(var i=0;i<m.lecons.length;i++)if(S.lu[m.id+"-"+i])n++;return n}
function passedCount(){return MODULES.filter(passed).length}
function nextModule(){for(var i=0;i<MODULES.length;i++)if(!passed(MODULES[i]))return MODULES[i];return null}
function finalOk(){return !!(S.final&&S.final.ok)}
var app=document.getElementById("app");
var lastHash=null;
var Q=null;

/* ---------- Navigation ---------- */
function updateNav(h){
  var items=[["accueil","Modules"],["examen","Examen final"],["certificat","Certificat"]];
  var cur=h.indexOf("module-")===0?"accueil":h;
  var html=items.map(function(it){return '<a href="#'+it[0]+'"'+(cur===it[0]?' aria-current="page"':"")+'>'+it[1]+'</a>'}).join("");
  html+='<span class="count" title="Modules validés">'+passedCount()+" / "+MODULES.length+" validés</span>";
  document.getElementById("nav").innerHTML=html;
}

/* ---------- Vues ---------- */

  var cards=MODULES.map(function(m){

  }).join("");
  var all=allPassed();
  var examCard='<a class="card'+(finalOk()?" is-ok":"")+'" href="#examen"><div class="cardtop"><span class="eyebrow">Examen final · 10 questions</span><span class="chip'+(finalOk()?" ok":(all?"":" lock"))+'">'+(finalOk()?"Réussi · "+pc(S.final.best):(all?"Disponible":"Verrouillé"))+'</span></div><h3>Valider l\'ensemble de la formation</h3><p>Dix questions tirées des cinq modules. Seuil de réussite : '+pc(PASS_FINAL)+'. Ouvert après la validation des cinq modules.</p></a>';
  var certCard='<a class="card'+(S.cert?" is-ok":"")+'" href="#certificat"><div class="cardtop"><span class="eyebrow">Certification</span><span class="chip'+(S.cert?" ok":(finalOk()?"":" lock"))+'">'+(S.cert?"Délivré":(finalOk()?"À générer":"Verrouillé"))+'</span></div><h3>Certificat de praticien en suivi-évaluation</h3><p>Un certificat nominatif avec date et code de vérification, que vous pouvez enregistrer.</p></a>';
  return '<section class="hero"><div><p class="eyebrow">Formation en ligne · 5 modules · environ 4 h</p><h1>Mesurer ce qui change vraiment</h1><div class="ticks" aria-hidden="true"></div><p class="lede">Apprenez à planifier, suivre et évaluer un projet : théorie du changement, cadre logique, indicateurs, collecte, analyse et rapportage. Chaque module se termine par un quiz corrigé, et l\'examen final ouvre droit à un certificat.</p><div class="cta-row">'+cta+'<span class="meta">'+passedCount()+" module(s) validé(s) sur "+MODULES.length+'</span></div></div>'+
   '<div class="logframe" role="group" aria-label="Exemple de cadre logique"><div class="cap"><span>Cadre logique · exemple</span><span>Programme eau potable</span></div><div class="tablewrap"><table><thead><tr><th>Niveau</th><th>Indicateur</th><th>Réf. → cible</th></tr></thead><tbody>'+tr+'</tbody></table></div></div></section>'+
   '<section class="sec"><h2>Programme</h2><p class="sub">Suivez les modules dans l\'ordre. Un module est validé à partir de '+pc(PASS)+' de bonnes réponses au quiz.</p><div class="grid">'+cards+'</div><div class="band">'+examCard+certCard+'</div></section>';
}

function quizIntro(m){
  var b=best(m.id);
  return '<div class="qbox" id="quiz-zone" tabindex="-1"><p class="eyebrow">Quiz du module '+m.id+'</p><h2>Vérifiez ce que vous avez retenu</h2><p class="lead">'+m.quiz.length+' questions, correction immédiate. Seuil de validation : '+pc(PASS)+'.'+(b!==null?' Votre meilleur score : '+pc(b)+(b>=PASS?" (module validé).":"."):"")+'</p><div class="qactions"><button class="btn" data-action="start-quiz" data-id="'+m.id+'">'+(b!==null?"Refaire le quiz":"Commencer le quiz")+'</button></div></div>';
}

function viewModule(id){
  var m=mod(id);if(!m)return viewHome();
  var ls=m.lecons.map(function(l,i){
    var on=!!S.lu[m.id+"-"+i];
    return '<article class="lesson"><h2>'+esc(l.t)+'</h2>'+l.p.map(function(p){return "<p>"+esc(p)+"</p>"}).join("")+'<div class="key"><b>À retenir</b>'+esc(l.cle)+'</div><button class="readbtn" data-action="lu" data-id="'+m.id+"-"+i+'" aria-pressed="'+on+'"><span class="box" aria-hidden="true">'+(on?"✓":"")+'</span>'+(on?"Lu":"Marquer comme lu")+'</button></article>';
  }).join("");
  var nav='';
  var nxt=mod(m.id+1);
  if(passed(m)){nav='<p class="note">Module validé. '+(nxt?'<a href="#module-'+nxt.id+'">Passer au module '+nxt.id+'</a>.':'<a href="'+(allPassed()?"#examen":"#accueil")+'">'+(allPassed()?"Passer à l'examen final":"Retour aux modules")+'</a>.')+'</p>'}
  return '<a class="back" href="#accueil">← Tous les modules</a><header class="mhead"><p class="eyebrow">Module '+m.id+' sur '+MODULES.length+' · '+m.duree+'</p><h1>'+esc(m.titre)+'</h1><p class="r">'+esc(m.resume)+'</p></header>'+ls+quizIntro(m)+nav;
}

  if(!allPassed()){
    var miss=MODULES.filter(function(m){return !passed(m)}).map(function(m){return '<li><a href="#module-'+m.id+'">Module '+m.id+' : '+esc(m.titre)+'</a></li>'}).join("");
    return '<div class="gate"><p class="eyebrow">Examen final</p><h1 style="font-size:1.9rem;margin-block:8px 10px">Pas encore accessible</h1><p>L\'examen s\'ouvre quand les cinq modules sont validés. Il reste à valider :</p><ul>'+miss+'</ul></div>';
  }
  var f=S.final;
  return '<div class="qbox" id="exam-zone" tabindex="-1" style="margin-top:0"><p class="eyebrow">Examen final</p><h2>Dix questions pour obtenir votre certificat</h2><p class="lead">Les questions couvrent les cinq modules. Seuil de réussite : '+pc(PASS_FINAL)+' (8 bonnes réponses sur 10). Vous pouvez recommencer autant de fois que nécessaire.'+(f?" Meilleur score : "+pc(f.best)+(f.ok?" (réussi).":"."):"")+'</p><div class="qactions"><button class="btn" data-action="start-exam">'+(f?"Repasser l'examen":"Commencer l'examen")+'</button>'+(finalOk()?'<a class="btn ghost" href="#certificat">Mon certificat</a>':"")+'</div></div>';

function makeCode(nom,iso,score){
  var s=(nom+"|"+iso+"|"+score).toLowerCase(),h=2166136261;
  for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}
  return "ASE-"+h.toString(16).toUpperCase().padStart(8,"0");
}
function fmtDate(iso){
  try{return new Date(iso+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}catch(e){return iso}
}

}

  }
  if(!S.cert){
    return '<div class="gate"><p class="eyebrow">Certificat</p><h1 style="font-size:1.9rem;margin-block:8px 10px">Félicitations, examen réussi</h1><p>Indiquez le nom qui doit figurer sur le certificat.</p><form id="nom-form" class="formrow" novalidate><div class="field"><label for="nom">Nom complet</label><input id="nom" name="nom" type="text" autocomplete="name" maxlength="80" required></div><button class="btn" type="submit">Générer mon certificat</button></form><p class="toast" id="toast" role="status"></p></div>';
  }
  return '<p class="eyebrow">Certificat</p><h1 style="font-size:2rem;margin-block:8px 0">Votre certificat</h1>'+certHtml(S.cert)+'<div class="qactions">'+(dl?'<button class="btn" data-action="save-cert">Enregistrer en SVG</button>':"")+'<button class="btn ghost" data-action="copy-code">Copier le code</button><button class="btn ghost" data-action="edit-name">Modifier le nom</button></div><p class="toast" id="toast" role="status"></p><p class="note">Ce certificat atteste la réussite de la formation en ligne de l\'Académie. Le code est généré dans votre navigateur : il ne remplace pas une accréditation officielle.</p>';
}

/* ---------- Rendu ---------- */
function render(scroll){
  var h=(location.hash||"").replace(/^#/,"")||"accueil";
  var html,mm=/^module-(\d+)$/.exec(h);
  if(mm){html=viewModule(parseInt(mm[1],10))}
  else if(h==="examen"){html=viewExam()}
  else if(h==="certificat"){html=viewCert()}
  else{h="accueil";html=viewHome()}
  app.innerHTML=html;
  updateNav(h);
  if(scroll!==false&&h!==lastHash){window.scrollTo(0,0)}
  lastHash=h;
}
window.addEventListener("hashchange",function(){Q=null;render(true)});

/* ---------- Quiz ---------- */
function zone(){return document.getElementById(Q.type==="final"?"exam-zone":"quiz-zone")}
function startQuiz(type,id){
  var qs=type==="final"?FINAL:mod(id).quiz;
  Q={type:type,id:id,qs:qs,i:0,correct:0,answered:false,missed:[],pass:type==="final"?PASS_FINAL:PASS};
  drawQuestion(true);
}
function drawQuestion(focus){
  var q=Q.qs[Q.i],z=zone();
  var letters="ABCD";
  var opts=q.o.map(function(t,i){return '<label class="opt"><input type="radio" name="o" value="'+i+'"><span class="lt" aria-hidden="true">'+letters[i]+'</span><span>'+esc(t)+'</span></label>'}).join("");
  var p=Math.round((Q.i/Q.qs.length)*100);
  z.innerHTML='<div class="qtop"><span class="small">Question '+(Q.i+1)+" sur "+Q.qs.length+'</span><div class="bar6"><span style="width:'+p+'%"></span></div></div><h2 class="qtitle" id="qt" tabindex="-1">'+esc(q.q)+'</h2><div class="opts" role="radiogroup" aria-labelledby="qt" id="opts">'+opts+'</div><div id="fb" aria-live="polite"></div><div class="qactions"><button class="btn" id="go" data-action="valider" disabled>Valider</button></div>';
  Q.answered=false;
  if(focus){z.scrollIntoView({block:"start"});var t=document.getElementById("qt");if(t)t.focus({preventScroll:true})}
}
function validate(){
  if(!Q||Q.answered)return;
  var sel=document.querySelector('#opts input:checked');if(!sel)return;
  var q=Q.qs[Q.i],v=parseInt(sel.value,10),good=v===q.a;
  Q.answered=true;
  if(good)Q.correct++;else Q.missed.push(Q.i);
  var labels=document.querySelectorAll("#opts .opt");
  labels.forEach(function(l,i){
    l.querySelector("input").disabled=true;
    l.classList.remove("sel");
    if(i===q.a)l.classList.add("ok");
    else if(i===v)l.classList.add("bad");
  });
  document.getElementById("opts").classList.add("done");
  document.getElementById("fb").innerHTML='<p class="fb '+(good?"ok":"bad")+'"><strong>'+(good?"Bonne réponse.":"Pas tout à fait.")+"</strong> "+(good?"":"La bonne réponse est « "+esc(q.o[q.a])+" ». ")+esc(q.e)+"</p>";
  var go=document.getElementById("go");
  go.textContent=Q.i+1<Q.qs.length?"Question suivante":"Voir le résultat";
  go.setAttribute("data-action","suivant");
}
function finish(){
  var total=Q.qs.length,pct=Math.round(Q.correct/total*100),ok=pct>=Q.pass;
  var z=zone(),extra="",title;
  if(Q.type==="module"){
    var prev=S.scores[Q.id],b=prev?Math.max(prev.best,pct):pct;
    S.scores[Q.id]={best:b,last:pct};
    var nx=mod(Q.id+1);
    title=ok?"Module validé":"Module non validé";
    if(ok){extra=nx?'<a class="btn" href="#module-'+nx.id+'">Module '+nx.id+' →</a>':'<a class="btn" href="#'+(allPassed()?"examen":"accueil")+'">'+(allPassed()?"Passer l'examen final":"Retour aux modules")+'</a>'}
  }else{
    var pf=S.final,bf=pf?Math.max(pf.best,pct):pct;
    S.final={best:bf,last:pct,ok:bf>=PASS_FINAL};
    title=ok?"Examen réussi":"Examen non réussi";
    if(ok){extra='<a class="btn" href="#certificat">Obtenir mon certificat</a>'}
  }
  save();updateNav(lastHash||"accueil");
  var rev="";
  if(Q.missed.length){
    rev='<div class="review"><p class="eyebrow">À revoir</p>'+Q.missed.map(function(i){var q=Q.qs[i];return "<div><b>"+esc(q.q)+"</b>Bonne réponse : "+esc(q.o[q.a])+". "+esc(q.e)+"</div>"}).join("")+"</div>";
  }
  z.innerHTML='<p class="eyebrow">'+title+'</p><p class="score" style="margin-block:10px 6px">'+Q.correct+" / "+total+'</p><p class="lead" style="margin-bottom:0">'+pc(pct)+" de bonnes réponses. Seuil : "+pc(Q.pass)+(ok?".":". Relisez les leçons puis recommencez.")+'</p>'+rev+'<div class="qactions" style="margin-top:20px">'+extra+'<button class="btn ghost" data-action="'+(Q.type==="final"?"start-exam":"start-quiz")+'" data-id="'+Q.id+'">Recommencer</button></div>';
  z.scrollIntoView({block:"start"});
  var t=z;t.focus({preventScroll:true});
  Q=null;
}

/* ---------- Certificat ---------- */
function svgEsc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function certSvg(c){
  return '<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700"><rect width="1000" height="700" fill="#FBFCFA"/><rect x="24" y="24" width="952" height="652" fill="none" stroke="#0F2E33" stroke-width="3"/><rect x="40" y="40" width="920" height="620" fill="none" stroke="#0F2E33" stroke-width="1"/>'+
  '<g font-family="Georgia, \'Times New Roman\', serif" text-anchor="middle" fill="#0F2E33">'+
  '<text x="500" y="130" font-size="20" letter-spacing="4" fill="#1C4FD1">ACADÉMIE SUIVI-ÉVALUATION</text>'+
  '<text x="500" y="215" font-size="44" font-weight="bold">Certificat de praticien</text>'+
  '<text x="500" y="268" font-size="44" font-weight="bold">en suivi-évaluation</text>'+
  '<text x="500" y="330" font-size="20" opacity="0.75">décerné à</text>'+
  '<text x="500" y="400" font-size="48" font-weight="bold">'+svgEsc(c.nom)+'</text>'+
  '<line x1="250" y1="420" x2="750" y2="420" stroke="#0F2E33" stroke-width="1"/>'+
  '<text x="500" y="478" font-size="20">pour avoir validé les cinq modules de la formation</text>'+
  '<text x="500" y="508" font-size="20">et réussi l\'examen final avec un score de '+c.score+' %.</text>'+
  '<text x="120" y="600" font-size="15" text-anchor="start" opacity="0.7">DATE</text>'+
  '<text x="120" y="626" font-size="20" text-anchor="start">'+svgEsc(fmtDate(c.iso))+'</text>'+
  '<text x="880" y="600" font-size="15" text-anchor="end" opacity="0.7">CODE DE VÉRIFICATION</text>'+
  '<text x="880" y="626" font-size="20" text-anchor="end" font-family="Consolas, monospace">'+svgEsc(c.code)+'</text></g></svg>';
}
function toast(msg){var t=document.getElementById("toast");if(t)t.textContent=msg}
function createCert(nom){
  var iso=new Date().toISOString().slice(0,10),score=S.final.best;
  S.cert={nom:nom,iso:iso,score:score,code:makeCode(nom,iso,score)};
  save();render(false);
}

/* ---------- Événements ---------- */
document.addEventListener("change",function(e){
  var t=e.target;
  if(t&&t.name==="o"&&Q&&!Q.answered){
    document.querySelectorAll("#opts .opt").forEach(function(l){l.classList.toggle("sel",l.contains(t)&&t.checked)});
    var go=document.getElementById("go");if(go)go.disabled=false;
  }
});
document.addEventListener("submit",function(e){
  if(e.target&&e.target.id==="nom-form"){
    e.preventDefault();
    var v=document.getElementById("nom").value.replace(/\s+/g," ").trim();
    if(v.length<2){toast("Saisissez votre nom complet.");return}
    createCert(v);
  }
});
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("[data-action]");if(!b)return;
  var a=b.getAttribute("data-action"),id=b.getAttribute("data-id");
  if(a==="lu"){Q=null;S.lu[id]=!S.lu[id];if(!S.lu[id])delete S.lu[id];save();render(false);updateNav(lastHash)}
  else if(a==="start-quiz"){startQuiz("module",parseInt(id,10))}
  else if(a==="start-exam"){startQuiz("final",0)}
  else if(a==="valider"){validate()}
  else if(a==="suivant"){if(!Q)return;Q.i++;if(Q.i<Q.qs.length)drawQuestion(true);else finish()}
  else if(a==="edit-name"){S.cert=null;save();render(false)}
  else if(a==="copy-code"){
    var code=S.cert&&S.cert.code;if(!code)return;
    try{navigator.clipboard.writeText(code).then(function(){toast("Code copié : "+code)},function(){toast("Copie refusée. Code : "+code)})}
    catch(err){toast("Copie impossible. Code : "+code)}
  }
  else if(a==="save-cert"){
    if(!dl||!S.cert)return;
    var fn="certificat-suivi-evaluation-"+S.cert.nom.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+".svg";
    dl.save({filename:fn,data:certSvg(S.cert)}).then(function(){toast("Certificat enregistré.")},function(err){toast(err&&err.code==="declined"?"Enregistrement annulé.":"Enregistrement impossible ici.")});
  }
});

render(true);
})();
</script>
